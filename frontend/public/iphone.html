<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giả lập iPhone — HDTLabx</title>
    <style>
      :root {
        --frame: #0b0b0d;
        --toolbar-bg: #1c1c1e;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #101014;
        color: #f2f2f7;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
      }

      /* ── Toolbar ── */
      .toolbar {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: var(--toolbar-bg);
        border-bottom: 0.5px solid #2c2c2e;
        z-index: 10;
      }
      .toolbar__group { display: flex; gap: 6px; align-items: center; }
      .toolbar__spacer { flex: 1; }
      .btn {
        appearance: none;
        border: 0.5px solid #3a3a3c;
        background: #2c2c2e;
        color: #f2f2f7;
        font-size: 13px;
        font-weight: 600;
        padding: 7px 12px;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .btn:hover { background: #3a3a3c; }
      .btn.is-active { background: #0a84ff; border-color: #0a84ff; color: #fff; }
      .btn--icon { padding: 7px 10px; font-size: 15px; }
      .field {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #2c2c2e;
        border: 0.5px solid #3a3a3c;
        border-radius: 999px;
        padding: 4px 6px 4px 12px;
      }
      .field input {
        background: transparent;
        border: none;
        outline: none;
        color: #f2f2f7;
        font-size: 13px;
        width: 220px;
        max-width: 40vw;
      }
      .field label { font-size: 12px; color: #8e8e93; }
      select.btn { padding-right: 8px; }
      .hint { font-size: 12px; color: #8e8e93; }

      /* ── Stage / device ── */
      .stage {
        flex: 1;
        width: 100%;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        overflow: auto;
        padding: 28px 16px 40px;
      }
      .device-scale {
        transform-origin: top center;
        transition: transform 0.15s ease;
      }
      .device {
        position: relative;
        width: 458px;               /* 430 screen + 14 bezel each side */
        height: 960px;              /* 932 screen + 14 bezel each side */
        background: var(--frame);
        border-radius: 68px;
        padding: 14px;
        box-shadow:
          0 0 0 2px #2a2a2e,
          0 30px 80px rgba(0, 0, 0, 0.55);
      }
      .device__screen {
        position: relative;
        width: 430px;
        height: 932px;
        background: #fff;
        border-radius: 54px;
        overflow: hidden;
      }
      .device__screen iframe {
        width: 430px;
        height: 932px;
        border: 0;
        display: block;
      }
      /* Dynamic Island */
      .device__island {
        position: absolute;
        top: 25px;                  /* 14 bezel + ~11 screen top margin */
        left: 50%;
        transform: translateX(-50%);
        width: 126px;
        height: 36px;
        background: #000;
        border-radius: 20px;
        z-index: 6;
        pointer-events: none;
      }
      /* Camera + sensor trong island */
      .device__island::after {
        content: '';
        position: absolute;
        top: 50%;
        right: 16px;
        transform: translateY(-50%);
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #3a3a4a 0%, #0a0a12 60%);
        box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.04);
      }
      /* Status bar mô phỏng (giờ · sóng · wifi · pin) */
      .device__statusbar {
        position: absolute;
        top: 25px;                  /* ngang island */
        left: 14px;
        right: 14px;
        height: 36px;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px 0 34px;
        color: #000;
        pointer-events: none;
      }
      .device__statusbar-time {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
      }
      .device__statusbar-icons {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .device__statusbar-icons svg { display: block; }
      /* Home indicator */
      .device__home {
        position: absolute;
        bottom: 22px;               /* 14 bezel + ~8 trong màn hình */
        left: 50%;
        transform: translateX(-50%);
        width: 140px;
        height: 5px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.28);
        z-index: 5;
        pointer-events: none;
      }
      .device__label {
        margin-top: 14px;
        text-align: center;
        font-size: 12px;
        color: #8e8e93;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <div class="toolbar__group" id="navGroup">
        <button class="btn" data-path="/dashboard">Dashboard</button>
        <button class="btn" data-path="/retail?tab=intake">Nhập</button>
        <button class="btn" data-path="/retail?tab=sale">Bán</button>
        <button class="btn" data-path="/customers">Khách</button>
      </div>
      <div class="field">
        <label for="pathInput">Đường dẫn</label>
        <input id="pathInput" type="text" value="/retail?tab=sale" spellcheck="false" />
      </div>
      <button class="btn" id="goBtn">Đi</button>
      <button class="btn btn--icon" id="reloadBtn" title="Tải lại">↻</button>
      <div class="toolbar__spacer"></div>
      <div class="toolbar__group">
        <span class="hint">Máy</span>
        <select class="btn" id="deviceSelect">
          <option value="430x932">iPhone 15 Pro Max (430×932)</option>
          <option value="393x852">iPhone 15 / 14 Pro (393×852)</option>
          <option value="390x844">iPhone 13/14 (390×844)</option>
          <option value="375x812">iPhone X / mini (375×812)</option>
        </select>
        <span class="hint">Cỡ</span>
        <select class="btn" id="scaleSelect">
          <option value="auto">Vừa màn</option>
          <option value="1">100%</option>
          <option value="0.9">90%</option>
          <option value="0.8">80%</option>
          <option value="0.7">70%</option>
        </select>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="device-scale" id="deviceScale">
        <div class="device" id="device">
          <div class="device__island"></div>
          <div class="device__statusbar">
            <span class="device__statusbar-time">9:41</span>
            <span class="device__statusbar-icons">
              <!-- Sóng -->
              <svg width="18" height="12" viewBox="0 0 18 12" fill="#000" aria-hidden="true">
                <rect x="0" y="8" width="3" height="4" rx="1"/>
                <rect x="5" y="6" width="3" height="6" rx="1"/>
                <rect x="10" y="3" width="3" height="9" rx="1"/>
                <rect x="15" y="0" width="3" height="12" rx="1"/>
              </svg>
              <!-- Wifi -->
              <svg width="17" height="12" viewBox="0 0 17 12" fill="#000" aria-hidden="true">
                <path d="M8.5 1.2c2.9 0 5.6 1.1 7.6 3l-1.5 1.5A9 9 0 0 0 8.5 3.3 9 9 0 0 0 2.4 5.7L.9 4.2c2-1.9 4.7-3 7.6-3Z"/>
                <path d="M8.5 5.2c1.7 0 3.3.7 4.5 1.8l-1.6 1.6a4 4 0 0 0-5.8 0L4 7a6.4 6.4 0 0 1 4.5-1.8Z"/>
                <circle cx="8.5" cy="10" r="1.6"/>
              </svg>
              <!-- Pin -->
              <svg width="27" height="13" viewBox="0 0 27 13" fill="none" aria-hidden="true">
                <rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="#000" stroke-opacity="0.4"/>
                <rect x="2" y="2" width="19" height="9" rx="2" fill="#000"/>
                <path d="M24.5 4v5a2 2 0 0 0 0-5Z" fill="#000" fill-opacity="0.4"/>
              </svg>
            </span>
          </div>
          <div class="device__screen">
            <iframe id="frame" title="HDTLabx iPhone preview"></iframe>
          </div>
          <div class="device__home"></div>
        </div>
        <div class="device__label" id="deviceLabel"></div>
      </div>
    </div>

    <script>
      const BEZEL = 14;
      const frame = document.getElementById('frame');
      const device = document.getElementById('device');
      const screenEl = device.querySelector('.device__screen');
      const iframeEl = document.getElementById('frame');
      const deviceScale = document.getElementById('deviceScale');
      const stage = document.getElementById('stage');
      const pathInput = document.getElementById('pathInput');
      const deviceSelect = document.getElementById('deviceSelect');
      const scaleSelect = document.getElementById('scaleSelect');
      const deviceLabel = document.getElementById('deviceLabel');
      const navGroup = document.getElementById('navGroup');

      let dims = { w: 430, h: 932 };

      function withPreviewParam(path) {
        // ép class preview iOS trong app (notch, shell)
        try {
          const u = new URL(path, location.origin);
          if (!u.searchParams.has('ios')) u.searchParams.set('ios', 'iphone14promax');
          return u.pathname + '?' + u.searchParams.toString() + u.hash;
        } catch {
          return path;
        }
      }

      function load(path) {
        const clean = path.trim() || '/';
        pathInput.value = clean;
        iframeEl.src = withPreviewParam(clean);
        // đánh dấu nút nav đang chọn
        [...navGroup.querySelectorAll('.btn')].forEach((b) => {
          b.classList.toggle('is-active', b.dataset.path === clean);
        });
      }

      function applyDims() {
        device.style.width = dims.w + BEZEL * 2 + 'px';
        device.style.height = dims.h + BEZEL * 2 + 'px';
        screenEl.style.width = dims.w + 'px';
        screenEl.style.height = dims.h + 'px';
        iframeEl.style.width = dims.w + 'px';
        iframeEl.style.height = dims.h + 'px';
        deviceLabel.textContent = dims.w + ' × ' + dims.h + ' pt';
        applyScale();
      }

      function applyScale() {
        const mode = scaleSelect.value;
        let scale = 1;
        if (mode === 'auto') {
          const avail = stage.clientHeight - 68; // padding + label
          scale = Math.min(1, avail / (dims.h + BEZEL * 2));
        } else {
          scale = parseFloat(mode) || 1;
        }
        deviceScale.style.transform = 'scale(' + scale + ')';
      }

      navGroup.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn');
        if (btn) load(btn.dataset.path);
      });
      document.getElementById('goBtn').addEventListener('click', () => load(pathInput.value));
      pathInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') load(pathInput.value);
      });
      document.getElementById('reloadBtn').addEventListener('click', () => {
        iframeEl.src = iframeEl.src;
      });
      deviceSelect.addEventListener('change', () => {
        const [w, h] = deviceSelect.value.split('x').map(Number);
        dims = { w, h };
        applyDims();
      });
      scaleSelect.addEventListener('change', applyScale);
      window.addEventListener('resize', applyScale);

      // init
      const startPath = new URLSearchParams(location.search).get('path') || '/retail?tab=sale';
      applyDims();
      load(startPath);
    </script>
  </body>
</html>
