services:
  mongodb:
    image: mongo:7
    container_name: hdtlabx-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: hdtlabx-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/hdtlabx-crm
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters}
      JWT_EXPIRE: 7d
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@hdtlabx.com}
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: production
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set a strong OWNER_PASSWORD of at least 12 characters}
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: hdtlabx-web
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  mongo_data:
